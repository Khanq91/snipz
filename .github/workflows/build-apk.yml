name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Get app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d'+' -f1)"
          BUILD_TIME="$(date -u +'%Y%m%d_%H%M')"
          echo "name=snipz_v${VERSION}_${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.name }}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Remove previous APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if assets="$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null)"; then
            while IFS= read -r asset; do
              case "$asset" in
                *.apk)
                  for attempt in 1 2 3; do
                    if gh release delete-asset latest "$asset" --yes; then
                      break
                    fi

                    if [ "$attempt" -eq 3 ]; then
                      echo "::warning::Could not remove previous APK asset: $asset"
                      break
                    fi

                    sleep "$((attempt * 3))"
                  done
                  ;;
              esac
            done <<< "$assets"
          fi

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.name }}.apk
          make_latest: true
