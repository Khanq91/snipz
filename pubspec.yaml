name: snipz
description: "Personal Flutter component vault — the app is just a visual index."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # App viewer (Phase 2, spec §11). Hive comes in Phase 4 — do not add early.
  flutter_riverpod: ^3.0.3
  go_router: ^17.2.5
  flutter_markdown_plus: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # tools/ only — frontmatter parsing and export zipping (spec §11).
  yaml: ^3.1.2
  archive: ^3.6.1

flutter:
  uses-material-design: true

  # PERMANENT two lines — never add per-component entries here.
  # build_index.dart generates everything under assets/ (spec §4, decision #6).
  assets:
    - assets/index.json
    - assets/sources/

  # Shader components are the one exception to the rule above: the shaders:
  # key does not support directories, so each .frag is listed explicitly.
  # Keep in sync with each component's `shaders_required` frontmatter.
  shaders:
    - lib/components/dither/dither.frag
    - lib/components/gradient_waves/gradient_waves.frag
    - lib/components/pixel_blast/pixel_blast.frag
