# Strict analyzer config — single file for the whole repo, including
# lib/components/ (spec §0.4d: no per-folder overrides; use targeted
# `// ignore:` lines for genuinely copied code instead).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Style consistency
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - unnecessary_parenthesis
    # Correctness
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_string_buffers
